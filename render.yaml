services:
  - type: web
    name: dishwise
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: logins and results live in memory, so workers must not be split.
    startCommand: gunicorn -w 1 --threads 8 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
